  const css=String.raw`

/* Editor */
.live-editor-toggle{position:fixed;left:14px;top:14px;z-index:360;border:1px solid rgba(84,51,38,.22);border-radius:999px;padding:10px 15px;background:rgba(248,236,212,.95);color:#4f2f24;box-shadow:0 8px 20px rgba(71,42,28,.14);cursor:pointer}.live-editor-toggle[aria-pressed=true]{background:#56362a;color:#fff8eb}
.editor-panel{display:none;position:fixed;left:14px;top:62px;z-index:355;width:min(420px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;padding:12px;border-radius:16px;background:rgba(45,35,31,.96);color:white;box-shadow:0 16px 40px rgba(0,0,0,.28);font-family:Arial,sans-serif}
body.live-editing .editor-panel{display:block}.editor-panel h3{font-size:.86rem;margin:0 0 4px}.editor-panel p{font-size:.68rem;line-height:1.45;opacity:.75;margin:0 0 8px}.editor-section{border-top:1px solid rgba(255,255,255,.12);padding-top:8px;margin-top:8px}.editor-section-title{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6;margin-bottom:6px}
.editor-actions,.font-actions,.layer-actions,.rotate-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.editor-actions button,.font-actions button,.layer-actions button,.rotate-actions button,.editor-panel select,.editor-panel input{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:7px 5px;font-size:.66rem;min-width:0}.editor-panel option{color:#222}.editor-actions button:disabled,.font-actions button:disabled,.layer-actions button:disabled,.rotate-actions button:disabled{opacity:.35}
.font-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:6px;margin-top:6px}.font-grid.three{grid-template-columns:repeat(3,1fr)}.font-color{width:100%;height:32px;padding:3px!important}.editor-note{font-size:.6rem;opacity:.52;margin-top:6px}
.sel-ui{display:none;position:fixed;z-index:380;pointer-events:none}body.live-editing .sel-ui.active{display:block}.move-handle{position:absolute;left:0;top:-29px;pointer-events:auto;border:0;border-radius:8px 8px 0 0;background:#56362a;color:white;padding:6px 9px;cursor:grab;font:bold .58rem Arial}.resize-handle{position:absolute;right:-8px;bottom:-8px;width:15px;height:15px;border:2px solid #fff;border-radius:50%;background:#7c1f2a;pointer-events:auto;cursor:nwse-resize}.sel-label{position:absolute;right:0;top:-27px;background:#fff8ef;color:#56362a;padding:4px 7px;border-radius:7px;font:bold .55rem Arial;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
body.live-editing [data-editable=true]{outline:1px dashed transparent;outline-offset:3px}body.live-editing [data-editable=true]:hover{outline-color:rgba(124,31,42,.42)}body.live-editing [data-selected=true]{outline:2px solid rgba(124,31,42,.82)!important;outline-offset:4px!important}body.live-editing [contenteditable=true]:focus{outline:2px solid rgba(168,121,67,.8)!important;outline-offset:3px!important}
body.live-editing .spotify-player button,body.live-editing .freeze-time,body.live-editing .verse-audio button,body.live-editing .verse-audio input,body.live-editing .verse-expander{pointer-events:none}

/* Save feedback */
.save-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:500;background:#3e302a;color:#fff9ee;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:11px 17px;box-shadow:0 12px 30px rgba(0,0,0,.22);font:600 .78rem Arial,sans-serif;opacity:0;pointer-events:none;transition:.28s}
.save-toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1024px){.verse-list{width:calc(100% - 22px)}.hero{padding-left:24px!important;padding-right:24px!important}.section{padding-left:22px!important;padding-right:22px!important}}
@media(max-width:768px){.hero{padding-left:18px!important;padding-right:18px!important}.section{padding-left:14px!important;padding-right:14px!important}.verse-list{width:calc(100% - 14px)}.verse-toggle{padding:15px}.verse-card.open .verse-copy{padding:4px 16px 22px}.spotify-player{grid-template-columns:78px minmax(0,1fr);width:calc(100% - 14px)}.spotify-art{width:78px;height:78px}.freeze-time{top:auto;bottom:12px}.live-editor-toggle{top:auto;bottom:58px}.editor-panel{top:auto;bottom:108px;max-height:68vh}.extra-white-flower{width:145px}.bouquet-cluster{width:155px;height:205px}.extra-cassette{width:165px}}
@media(max-width:520px){.hero h1{font-size:clamp(2.6rem,15vw,4.8rem)!important}.spotify-player{grid-template-columns:60px minmax(0,1fr);padding:10px}.spotify-art{width:60px;height:60px}.spotify-controls{grid-template-columns:repeat(5,minmax(30px,1fr))}.verse-audio{padding:7px 8px}.editor-panel{left:8px;width:calc(100vw - 16px);bottom:106px}.font-grid{grid-template-columns:1fr 1fr}.font-grid.three{grid-template-columns:1fr 1fr 1fr}.sel-label{display:none}.memory-note,.doctor-note{width:calc(100% - 24px)}.extra-white-flower,.bouquet-cluster,.extra-cassette{opacity:.48}}
`;

  const js=String.raw`(()=>{
    const body=document.body,main=document.getElementById('letter'),masterAudio=document.getElementById('audio');
    if(!main||!masterAudio)return;
    const KHAT_FILE='assets/asset-07-a968de82ccb4.mp3';
    const KHAT_COVER='https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/ea/01/29/ea012994-51e8-6883-e1e1-c71fdd51754f/5026854264479.jpg/1200x1200bb.jpg';
    const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
    const q=id=>document.getElementById(id);

    /* Remove red rose artwork without changing the letter text or background. */
    document.querySelectorAll('img').forEach(img=>{
      const src=img.getAttribute('src')||'';
      if(src.includes('asset-02-8f5a2762061d.png')) img.src='assets/asset-04-96ecfc0d24b6.png';
      if(src.includes('asset-05-6d48267ac123.png')) img.src='assets/asset-06-71b98f2e9f3c.png';
    });

    const hero=main.querySelector('.hero');
    if(hero){
      const white=document.createElement('img');white.className='scrapbook-png extra-white-flower';white.src='assets/asset-04-96ecfc0d24b6.png';white.alt='';
      const bouquet=document.createElement('div');bouquet.className='bouquet-cluster';
      for(let i=0;i<3;i++){const f=document.createElement('img');f.className='scrapbook-png';f.src='assets/asset-04-96ecfc0d24b6.png';f.alt='';bouquet.appendChild(f)}
      const cassette=document.createElement('img');cassette.className='scrapbook-png extra-cassette';cassette.src='assets/asset-06-71b98f2e9f3c.png';cassette.alt='';
      hero.append(white,bouquet,cassette);
    }

    const fav=document.createElement('div');fav.className='memory-note';
    fav.innerHTML='<h3>Her favourite songs</h3><ul><li>Khat</li><li>Hosanna</li><li>Add another song</li></ul>';
    const doc=document.createElement('div');doc.className='doctor-note';
    doc.innerHTML='<div class="rx">Rx</div><h3>Doctor in the story</h3><p>A small corner for the part of her world that is always caring, healing and on call.</p>';

    const secs=[...main.querySelectorAll(':scope > .section')].filter(s=>s.querySelector('.verse'));
    const wrap=document.createElement('div');wrap.className='verse-list';wrap.id='verses';
    const verseAudios=[];

    function pauseEverything(except){
      verseAudios.forEach(a=>{if(a!==except)a.pause()});
      if(masterAudio!==except) masterAudio.pause();
      document.querySelectorAll('audio').forEach(a=>{if(a!==except)a.pause()});
    }

    function buildVerseAudio(){
      const p=document.createElement('div');p.className='verse-audio';
      p.innerHTML='<button type="button">Play</button><div class="verse-audio-main"><div class="verse-audio-title"><strong>Khat</strong><span>Navjot Ahuja</span></div><input type="range" min="0" max="1000" value="0" aria-label="Khat progress"><div class="verse-audio-time"><span>0:00</span><span>0:00</span></div></div>';
      const a=new Audio(KHAT_FILE);a.preload='metadata';verseAudios.push(a);
      const btn=p.querySelector('button'),seek=p.querySelector('input'),times=p.querySelectorAll('.verse-audio-time span');
      const sync=()=>{btn.textContent=a.paused?'Play':'Pause';times[0].textContent=fmt(a.currentTime);times[1].textContent=fmt(a.duration);seek.value=a.duration?Math.round(a.currentTime/a.duration*1000):0};
      btn.onclick=()=>{if(a.paused){pauseEverything(a);a.play().catch(()=>{})}else a.pause()};
      seek.oninput=()=>{if(a.duration)a.currentTime=a.duration*(+seek.value/1000)};
      ['timeupdate','loadedmetadata','play','pause','ended'].forEach(ev=>a.addEventListener(ev,sync));
      sync();return p;
    }

    secs.forEach(sec=>{
      sec.classList.add('verse-card');
      const article=sec.querySelector('.verse'),num=article.querySelector('.verse-number'),ttl=article.querySelector('h2');
      const labelText=num?.textContent||'',titleText=ttl?.textContent||'';
      const header=document.createElement('div');header.className='verse-toggle';
      header.innerHTML='<div class="verse-heading"><small class="verse-label-editable"></small><strong class="verse-title-editable"></strong></div><button class="verse-expander" type="button" aria-expanded="false" aria-label="Open verse"><span class="chev"></span></button>';
      header.querySelector('small').textContent=labelText;
      header.querySelector('strong').textContent=titleText;
      const panel=document.createElement('div');panel.className='verse-panel';
      const copy=document.createElement('div');copy.className='verse-copy';
      [...article.childNodes].forEach(n=>{if(n!==num&&n!==ttl)copy.appendChild(n)});
      num?.remove();ttl?.remove();
      copy.appendChild(buildVerseAudio());panel.appendChild(copy);article.append(header,panel);
      const expander=header.querySelector('.verse-expander');
      const toggle=()=>{if(body.classList.contains('live-editing'))return;const open=sec.classList.toggle('open');expander.setAttribute('aria-expanded',String(open))};
      expander.addEventListener('click',toggle);
      header.querySelector('.verse-heading').addEventListener('click',toggle);
      wrap.appendChild(sec);
    });
    hero?.insertAdjacentElement('afterend',wrap);
    wrap.insertAdjacentElement('beforebegin',fav);
    wrap.insertAdjacentElement('afterend',doc);

    const scrollHint=document.querySelector('.scroll-hint');if(scrollHint){scrollHint.style.cursor='pointer';scrollHint.onclick=()=>wrap.scrollIntoView({behavior:'smooth'})}

    const freeze=document.createElement('button');freeze.className='freeze-time';freeze.type='button';freeze.textContent='Freeze the time';
    freeze.onclick=()=>{const f=body.classList.toggle('time-frozen');freeze.textContent=f?'Let time flow':'Freeze the time'};
    body.appendChild(freeze);

    /* Main playlist-ready player */
    const old=document.getElementById('musicCard'),pl=document.createElement('div');pl.id='musicCard';pl.className='spotify-player';
    pl.innerHTML='<div class="spotify-art"><img id="cover" alt="Khat artwork"></div><div><button class="playlist-toggle" id="plistBtn" type="button">Playlist</button><h3 id="tt">Khat</h3><p id="ar">Navjot Ahuja</p><input id="seek" class="spotify-seek" type="range" min="0" max="1000" value="0"><div class="spotify-time"><span id="ct">0:00</span><span id="dt">0:00</span></div><div class="spotify-controls"><button id="prev" type="button">|&lt;</button><button id="b10" type="button">-10</button><button id="play" class="spotify-play" type="button">Play</button><button id="f10" type="button">+10</button><button id="next" type="button">&gt;|</button></div><div id="drawer" class="playlist-drawer"><div id="rows"></div></div></div>';
    old?.replaceWith(pl);
    const list=[{title:'Khat',artist:'Navjot Ahuja',file:KHAT_FILE,cover:KHAT_COVER}];let ix=0;
    function rows(){q('rows').innerHTML='';list.forEach((t,i)=>{const x=document.createElement('div');x.className='playlist-row';x.innerHTML='<img><div><strong></strong><small></small></div><span></span>';x.querySelector('img').src=t.cover;x.querySelector('strong').textContent=t.title;x.querySelector('small').textContent=t.artist;x.onclick=()=>load(i,true);q('rows').appendChild(x)})}
    function syncMaster(){q('play').textContent=masterAudio.paused?'Play':'Pause';q('ct').textContent=fmt(masterAudio.currentTime);q('dt').textContent=fmt(masterAudio.duration);q('seek').value=masterAudio.duration?masterAudio.currentTime/masterAudio.duration*1000:0}
    function load(i,auto){ix=(i+list.length)%list.length;const t=list[ix];masterAudio.src=t.file;q('cover').src=t.cover;q('tt').textContent=t.title;q('ar').textContent=t.artist;rows();if(auto){pauseEverything(masterAudio);masterAudio.play().catch(()=>{})}}
    q('play').onclick=()=>{if(masterAudio.paused){pauseEverything(masterAudio);masterAudio.play().catch(()=>{})}else masterAudio.pause()};
    q('b10').onclick=()=>masterAudio.currentTime=Math.max(0,masterAudio.currentTime-10);
    q('f10').onclick=()=>masterAudio.currentTime=Math.min(masterAudio.duration||1e9,masterAudio.currentTime+10);
    q('prev').onclick=()=>load(ix-1,true);q('next').onclick=()=>load(ix+1,true);
    q('seek').oninput=()=>{if(masterAudio.duration)masterAudio.currentTime=masterAudio.duration*q('seek').value/1000};
    q('plistBtn').onclick=()=>q('drawer').classList.toggle('open');
    ['timeupdate','loadedmetadata','play','pause'].forEach(e=>masterAudio.addEventListener(e,syncMaster));
    load(0,false);syncMaster();

    /* Live editor */
    const key='theDproject-editor-v6';
    const et=document.createElement('button');et.className='live-editor-toggle';et.type='button';et.textContent='Edit layout';et.setAttribute('aria-pressed','false');
    const ep=document.createElement('div');ep.className='editor-panel';
    ep.innerHTML='<h3>Live edit mode</h3><p>All verse labels, titles, verse text and scrapbook PNGs can be edited here.</p><div class="editor-actions"><button id="undoEd">Undo</button><button id="redoEd">Redo</button><button id="saveEd">Save</button><button id="resetEd">Reset</button></div><div class="editor-section"><div class="editor-section-title">PNG layer</div><div class="layer-actions"><button id="layerDown">Layer -</button><button id="layerUp">Layer +</button><button id="sendBack">Send back</button><button id="bringFront">Bring front</button></div></div><div class="editor-section"><div class="editor-section-title">PNG rotation</div><div class="rotate-actions"><button id="rotLeft">-5 deg</button><button id="rotRight">+5 deg</button><button id="rotReset">Reset</button><input id="rotAngle" type="number" min="-360" max="360" step="1" placeholder="Angle"></div><div class="editor-note">Layer and rotation controls apply to the selected PNG.</div></div><div class="editor-section"><div class="editor-section-title">Text formatting</div><div class="font-actions"><button id="fontMinus">A-</button><button id="fontPlus">A+</button><button id="boldEd"><b>B</b></button><button id="italicEd"><i>I</i></button><button id="underlineEd"><u>U</u></button><button id="alignLeft">Left</button><button id="alignCenter">Center</button><button id="alignRight">Right</button></div><div class="font-grid"><select id="fontFamily"><option value="">Font family</option><option value="Segoe Print, Bradley Hand, Comic Sans MS, cursive">Handwritten</option><option value="Georgia, serif">Georgia</option><option value="Arial, sans-serif">Arial</option><option value="Times New Roman, serif">Times</option><option value="Courier New, monospace">Courier</option></select><input id="fontSize" type="number" min="8" max="120" step="1" placeholder="Size px"></div><div class="font-grid three"><input id="fontColor" class="font-color" type="color" value="#4f2f24"><input id="lineHeight" type="number" min="0.8" max="4" step="0.1" placeholder="Line height"><input id="letterSpacing" type="number" min="-3" max="20" step="0.1" placeholder="Spacing"></div></div><div class="editor-section"><div class="editor-actions"><button id="copyEd">Copy for ChatGPT</button><button id="downloadEd">Download edits</button></div><div class="editor-note">Save keeps the edit on this device and downloads a JSON copy for making it permanent in GitHub later.</div></div>';
    const su=document.createElement('div');su.className='sel-ui';su.innerHTML='<button class="move-handle">Move</button><span class="sel-label"></span><span class="resize-handle"></span>';
    const toast=document.createElement('div');toast.className='save-toast';toast.textContent='Changes saved on this device.';
    body.append(et,ep,su,toast);

    let mode=false,sel=null,drag=null,res=null;const undoStack=[],redoStack=[];let openBeforeEdit=[];
    function candidates(){return[...document.body.querySelectorAll('img,.hero h1,.hero .subtitle,.hero .kicker,.scroll-hint,.verse-label-editable,.verse-title-editable,.verse-copy p,.verse-copy li,.verse-copy blockquote,.verse-copy .quote,.ending h2,.ending p,.signature,.spotify-player h3,.spotify-player p,.memory-note h3,.memory-note li,.doctor-note .rx,.doctor-note h3,.doctor-note p')].filter(e=>!e.closest('.editor-panel,.sel-ui'))}
    function ids(){let i=0;candidates().forEach(e=>{if(!e.dataset.eid)e.dataset.eid='e'+(++i);e.dataset.editable='true'})}
    function state(){return candidates().map(e=>({id:e.dataset.eid,text:e.tagName==='IMG'?null:e.innerHTML,x:+(e.dataset.ex||0),y:+(e.dataset.ey||0),w:e.style.width||'',h:e.style.height||'',z:e.style.zIndex||'',rot:e.style.rotate||'',fontFamily:e.style.fontFamily||'',fontSize:e.style.fontSize||'',fontWeight:e.style.fontWeight||'',fontStyle:e.style.fontStyle||'',textDecoration:e.style.textDecoration||'',textAlign:e.style.textAlign||'',color:e.style.color||'',lineHeight:e.style.lineHeight||'',letterSpacing:e.style.letterSpacing||''}))}
    function snap(){const s=JSON.stringify(state());if(undoStack[undoStack.length-1]!==s){undoStack.push(s);if(undoStack.length>60)undoStack.shift();redoStack.length=0}buttons();return s}
    function applyArray(a){const m=new Map(a.map(x=>[x.id,x]));candidates().forEach(e=>{const x=m.get(e.dataset.eid);if(!x)return;if(x.text!==null&&e.tagName!=='IMG')e.innerHTML=x.text;e.dataset.ex=x.x||0;e.dataset.ey=x.y||0;e.style.translate=(x.x||0)+'px '+(x.y||0)+'px';e.style.width=x.w||'';e.style.height=x.h||'';e.style.zIndex=x.z||'';e.style.rotate=x.rot||'';e.style.fontFamily=x.fontFamily||'';e.style.fontSize=x.fontSize||'';e.style.fontWeight=x.fontWeight||'';e.style.fontStyle=x.fontStyle||'';e.style.textDecoration=x.textDecoration||'';e.style.textAlign=x.textAlign||'';e.style.color=x.color||'';e.style.lineHeight=x.lineHeight||'';e.style.letterSpacing=x.letterSpacing||''})}
    function saveLocal(){localStorage.setItem(key,JSON.stringify(state()))}
    function loadSaved(){let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch{}applyArray(a)}
    function exportPayload(){return JSON.stringify({version:6,repo:'Vtslkumar1303/theDproject',savedAt:new Date().toISOString(),changes:state()},null,2)}
    function downloadPayload(){const blob=new Blob([exportPayload()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='theDproject-edits.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function setEditing(on){candidates().forEach(e=>{if(e.tagName!=='IMG'){e.contentEditable=on?'true':'false';e.spellcheck=false}else e.removeAttribute('contenteditable')})}
    function box(){if(!mode||!sel){su.classList.remove('active');return}const r=sel.getBoundingClientRect();su.classList.add('active');su.style.left=r.left+'px';su.style.top=r.top+'px';su.style.width=r.width+'px';su.style.height=r.height+'px';su.querySelector('.sel-label').textContent=sel.tagName==='IMG'?'PNG image':(sel.textContent.trim().slice(0,24)||sel.tagName.toLowerCase())}
    function pick(e){if(sel!==e)snap();sel?.removeAttribute('data-selected');sel=e;sel.dataset.selected='true';box();controls();buttons()}
    function textTarget(){return sel&&sel.tagName!=='IMG'?sel:null}
    function imgTarget(){return sel&&sel.tagName==='IMG'?sel:null}
    function rgbToHex(rgb){const m=rgb.match(/\d+/g);if(!m||m.length<3)return'#4f2f24';return'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('')}
    function controls(){const t=textTarget();if(t){const c=getComputedStyle(t);q('fontSize').value=Math.round(parseFloat(c.fontSize))||'';q('fontColor').value=rgbToHex(c.color);q('lineHeight').value=c.lineHeight==='normal'?'':(parseFloat(c.lineHeight)/parseFloat(c.fontSize)).toFixed(1);q('letterSpacing').value=c.letterSpacing==='normal'?'':parseFloat(c.letterSpacing)||0}const im=imgTarget();q('rotAngle').value=im?(parseFloat(im.style.rotate)||0):''}
    function buttons(){q('undoEd').disabled=undoStack.length<2;q('redoEd').disabled=!redoStack.length;const ok=!!imgTarget();['layerDown','layerUp','sendBack','bringFront','rotLeft','rotRight','rotReset'].forEach(id=>q(id).disabled=!ok);q('rotAngle').disabled=!ok}
    function style(prop,val){const t=textTarget();if(!t)return;snap();t.style[prop]=val;snap();saveLocal();box();controls()}
    function layer(setter){const t=imgTarget();if(!t)return;snap();const cur=parseInt(getComputedStyle(t).zIndex)||3;t.style.zIndex=String(setter(cur));snap();saveLocal();box()}
    function rotateBy(delta){const t=imgTarget();if(!t)return;snap();const cur=parseFloat(t.style.rotate)||0;t.style.rotate=(cur+delta)+'deg';snap();saveLocal();box();controls()}
    function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}

    et.onclick=()=>{
      mode=!mode;body.classList.toggle('live-editing',mode);et.setAttribute('aria-pressed',String(mode));et.textContent=mode?'Finish editing':'Edit layout';ids();setEditing(mode);loadSaved();
      if(mode){openBeforeEdit=secs.map(s=>s.classList.contains('open'));secs.forEach(s=>s.classList.add('open'));undoStack.length=0;redoStack.length=0;snap()}
      else{secs.forEach((s,i)=>{if(!openBeforeEdit[i])s.classList.remove('open')});sel?.removeAttribute('data-selected');sel=null;su.classList.remove('active');saveLocal()}
      buttons()
    };
    document.addEventListener('pointerdown',e=>{if(!mode||e.target.closest('.editor-panel,.sel-ui,.live-editor-toggle'))return;const x=e.target.closest('[data-editable=true]');if(x)pick(x)},true);
    document.addEventListener('beforeinput',e=>{if(mode&&e.target.matches('[contenteditable=true]'))snap()});
    document.addEventListener('input',e=>{if(mode&&e.target.matches('[contenteditable=true]')){snap();saveLocal();box()}});
    addEventListener('scroll',box,{passive:true});addEventListener('resize',box);

    const mh=su.querySelector('.move-handle');
    mh.onpointerdown=e=>{if(!sel)return;e.preventDefault();snap();mh.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:+(sel.dataset.ex||0),oy:+(sel.dataset.ey||0)}};
    mh.onpointermove=e=>{if(!drag||!sel)return;const x=Math.round(drag.ox+e.clientX-drag.x),y=Math.round(drag.oy+e.clientY-drag.y);sel.dataset.ex=x;sel.dataset.ey=y;sel.style.translate=x+'px '+y+'px';box()};
    mh.onpointerup=()=>{drag=null;snap();saveLocal()};
    const rh=su.querySelector('.resize-handle');
    rh.onpointerdown=e=>{if(!sel)return;e.preventDefault();snap();rh.setPointerCapture(e.pointerId);const r=sel.getBoundingClientRect();res={x:e.clientX,y:e.clientY,w:r.width,h:r.height}};
    rh.onpointermove=e=>{if(!res||!sel)return;sel.style.width=Math.max(24,res.w+e.clientX-res.x)+'px';if(sel.tagName==='IMG')sel.style.height='auto';else sel.style.height=Math.max(18,res.h+e.clientY-res.y)+'px';box()};
    rh.onpointerup=()=>{res=null;snap();saveLocal()};

    q('undoEd').onclick=()=>{if(undoStack.length<2)return;const cur=undoStack.pop();redoStack.push(cur);applyArray(JSON.parse(undoStack[undoStack.length-1]));saveLocal();box();buttons();controls()};
    q('redoEd').onclick=()=>{if(!redoStack.length)return;const n=redoStack.pop();undoStack.push(n);applyArray(JSON.parse(n));saveLocal();box();buttons();controls()};
    q('saveEd').onclick=()=>{snap();saveLocal();downloadPayload();showToast('Changes saved. Edit file downloaded for ChatGPT/GitHub.')};
    q('resetEd').onclick=()=>{if(confirm('Reset saved live edits on this device?')){localStorage.removeItem(key);location.reload()}};
    q('copyEd').onclick=async()=>{const t=exportPayload();try{await navigator.clipboard.writeText(t);showToast('Changes copied for ChatGPT.')}catch{prompt('Copy changes:',t)}};
    q('downloadEd').onclick=()=>{downloadPayload();showToast('Edit file downloaded.')};

    q('layerDown').onclick=()=>layer(z=>z-1);q('layerUp').onclick=()=>layer(z=>z+1);q('sendBack').onclick=()=>layer(()=>1);q('bringFront').onclick=()=>layer(()=>60);
    q('rotLeft').onclick=()=>rotateBy(-5);q('rotRight').onclick=()=>rotateBy(5);q('rotReset').onclick=()=>{const t=imgTarget();if(t){snap();t.style.rotate='0deg';snap();saveLocal();controls()}};
    q('rotAngle').onchange=e=>{const t=imgTarget();if(t){snap();const v=Math.max(-360,Math.min(360,+e.target.value||0));t.style.rotate=v+'deg';snap();saveLocal();box()}};

    q('fontPlus').onclick=()=>{const t=textTarget();if(t)style('fontSize',(parseFloat(getComputedStyle(t).fontSize)+1)+'px')};
    q('fontMinus').onclick=()=>{const t=textTarget();if(t)style('fontSize',Math.max(8,parseFloat(getComputedStyle(t).fontSize)-1)+'px')};
    q('boldEd').onclick=()=>{const t=textTarget();if(t)style('fontWeight',parseInt(getComputedStyle(t).fontWeight)>=600?'400':'700')};
    q('italicEd').onclick=()=>{const t=textTarget();if(t)style('fontStyle',getComputedStyle(t).fontStyle==='italic'?'normal':'italic')};
    q('underlineEd').onclick=()=>{const t=textTarget();if(t)style('textDecoration',getComputedStyle(t).textDecorationLine.includes('underline')?'none':'underline')};
    q('alignLeft').onclick=()=>style('textAlign','left');q('alignCenter').onclick=()=>style('textAlign','center');q('alignRight').onclick=()=>style('textAlign','right');
    q('fontFamily').onchange=e=>{if(e.target.value)style('fontFamily',e.target.value)};
    q('fontSize').onchange=e=>style('fontSize',Math.max(8,Math.min(120,+e.target.value||16))+'px');
    q('fontColor').oninput=e=>style('color',e.target.value);
    q('lineHeight').onchange=e=>style('lineHeight',String(Math.max(.8,Math.min(4,+e.target.value||1.5))));
    q('letterSpacing').onchange=e=>style('letterSpacing',Math.max(-3,Math.min(20,+e.target.value||0))+'px');

    ids();loadSaved();buttons();
  })();`;

  h=h.replace('</head>','<style>'+css+'</style></head>');

}catch(e){
  document.getElementById('boot').textContent='The letter could not be loaded. Please refresh once.';
  console.error(e);
}
