  const js=String.raw`(()=>{

    pl.innerHTML='<div class="spotify-art"><img id="cover" alt="Khat artwork"></div><div><button class="playlist-toggle" id="plistBtn" type="button">Playlist</button><h3 id="tt">Khat</h3><p id="ar">Navjot Ahuja</p><input id="seek" class="spotify-seek" type="range" min="0" max="1000" value="0"><div class="spotify-time"><span id="ct">0:00</span><span id="dt">0:00</span></div><div class="spotify-controls"><button id="prev" type="button">|&lt;</button><button id="b10" type="button">-10</button><button id="play" class="spotify-play" type="button">Play</button><button id="f10" type="button">+10</button><button id="next" type="button">&gt;|</button></div><div id="drawer" class="playlist-drawer"><div id="rows"></div></div></div>';old?.replaceWith(pl);
    const list=[{title:'Khat',artist:'Navjot Ahuja',file:KHAT_FILE,cover:KHAT_COVER}];let ix=0;const q=id=>document.getElementById(id);
    function rows(){q('rows').innerHTML='';list.forEach((t,i)=>{const x=document.createElement('div');x.className='playlist-row';x.innerHTML='<img><div><strong></strong><small></small></div><span></span>';x.querySelector('img').src=t.cover;x.querySelector('strong').textContent=t.title;x.querySelector('small').textContent=t.artist;x.onclick=()=>load(i,true);q('rows').appendChild(x)})}
    function syncMaster(){q('play').textContent=masterAudio.paused?'Play':'Pause';q('ct').textContent=fmt(masterAudio.currentTime);q('dt').textContent=fmt(masterAudio.duration);q('seek').value=masterAudio.duration?masterAudio.currentTime/masterAudio.duration*1000:0}
    function load(i,auto){ix=(i+list.length)%list.length;const t=list[ix];masterAudio.src=t.file;q('cover').src=t.cover;q('tt').textContent=t.title;q('ar').textContent=t.artist;rows();if(auto){verseAudios.forEach(a=>a.pause());masterAudio.play().catch(()=>{})}}
    q('play').onclick=()=>{if(masterAudio.paused){verseAudios.forEach(a=>a.pause());masterAudio.play().catch(()=>{})}else masterAudio.pause()};q('b10').onclick=()=>masterAudio.currentTime=Math.max(0,masterAudio.currentTime-10);q('f10').onclick=()=>masterAudio.currentTime=Math.min(masterAudio.duration||1e9,masterAudio.currentTime+10);q('prev').onclick=()=>load(ix-1,true);q('next').onclick=()=>load(ix+1,true);q('seek').oninput=()=>{if(masterAudio.duration)masterAudio.currentTime=masterAudio.duration*q('seek').value/1000};q('plistBtn').onclick=()=>q('drawer').classList.toggle('open');['timeupdate','loadedmetadata','play','pause'].forEach(e=>masterAudio.addEventListener(e,syncMaster));load(0,false);syncMaster();
    const key='theDproject-editor-v5',et=document.createElement('button');et.className='live-editor-toggle';et.type='button';et.textContent='Edit layout';et.setAttribute('aria-pressed','false');

s="editor-note">Save stores changes in this browser and downloads the edit file so the same changes can be given back to ChatGPT later.</div></div>';
    const su=document.createElement('div');su.className='sel-ui';su.innerHTML='<button class="move-handle">Move</button><span class="sel-label"></span><span class="resize-handle"></span>';body.append(et,ep,su);
    let mode=false,sel=null,drag=null,res=null;const undoStack=[],redoStack=[];
    function candidates(){return[...document.body.querySelectorAll('img,.hero h1,.hero .subtitle,.hero .kicker,.scroll-hint,.verse-toggle small,.verse-toggle strong,.verse-copy p,.verse-copy li,.verse-copy blockquote,.verse-copy .quote,.ending h2,.ending p,.signature,.spotify-player h3,.spotify-player p')].filter(e=>!e.closest('.editor-panel,.sel-ui'))}
    function ids(){let i=0;candidates().forEach(e=>{if(!e.dataset.eid)e.dataset.eid='e'+(++i);e.dataset.editable='true'})}
    function state(){return candidates().map(e=>({id:e.dataset.eid,text:e.tagName==='IMG'?null:e.innerHTML,x:+(e.dataset.ex||0),y:+(e.dataset.ey||0),w:e.style.width||'',h:e.style.height||'',z:e.style.zIndex||'',fontFamily:e.style.fontFamily||'',fontSize:e.style.fontSize||'',fontWeight:e.style.fontWeight||'',fontStyle:e.style.fontStyle||'',textDecoration:e.style.textDecoration||'',textAlign:e.style.textAlign||'',color:e.style.color||'',lineHeight:e.style.lineHeight||'',letterSpacing:e.style.letterSpacing||''}))}

    function applyArray(a){const m=new Map(a.map(x=>[x.id,x]));candidates().forEach(e=>{const x=m.get(e.dataset.eid);if(!x)return;if(x.text!==null&&e.tagName!=='IMG')e.innerHTML=x.text;e.dataset.ex=x.x||0;e.dataset.ey=x.y||0;e.style.translate=(x.x||0)+'px '+(x.y||0)+'px';e.style.width=x.w||'';e.style.height=x.h||'';e.style.zIndex=x.z||'';e.style.fontFamily=x.fontFamily||'';e.style.fontSize=x.fontSize||'';e.style.fontWeight=x.fontWeight||'';e.style.fontStyle=x.fontStyle||'';e.style.textDecoration=x.textDecoration||'';e.style.textAlign=x.textAlign||'';e.style.color=x.color||'';e.style.lineHeight=x.lineHeight||'';e.style.letterSpacing=x.letterSpacing||''})}
