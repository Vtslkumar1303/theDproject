<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To, my March</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#efe0c2;color:#5b392d;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}body{min-height:100vh;background:linear-gradient(rgba(250,239,214,.86),rgba(245,227,194,.9)),radial-gradient(circle at 20% 15%,rgba(255,255,255,.45),transparent 28%),#efe0c2}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(520px,100%);padding:34px 28px 30px;border:1px solid rgba(103,70,49,.2);border-radius:24px;background:linear-gradient(180deg,rgba(255,248,233,.98),rgba(246,228,196,.97));box-shadow:0 26px 60px rgba(75,47,31,.16),inset 0 1px 0 rgba(255,255,255,.72);text-align:center;position:relative;overflow:hidden}.auth-card:before{content:"";position:absolute;top:-9px;left:50%;width:88px;height:25px;transform:translateX(-50%) rotate(-2deg);background:rgba(229,202,155,.65);box-shadow:0 2px 6px rgba(68,43,30,.08)}.auth-kicker{margin-bottom:7px;color:#9b7562;font:italic .76rem/1.45 Georgia,serif}.auth-card h1{margin:0 0 9px;font-size:clamp(1.7rem,6vw,2.45rem);font-weight:700;color:#684437}.auth-copy{margin:0 auto 20px;max-width:410px;color:#856454;font:italic .84rem/1.6 Georgia,serif}.auth-row{display:flex;gap:10px}.auth-input{flex:1;min-width:0;padding:13px 14px;border:1px solid rgba(111,75,56,.2);border-radius:14px;background:#fffaf0;color:#5b392d;outline:none;font:700 1rem/1 Arial,sans-serif;letter-spacing:.22em;text-align:center}.auth-input:focus{border-color:rgba(152,91,76,.38);box-shadow:0 0 0 3px rgba(152,91,76,.07)}.auth-btn{border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(180deg,#d79a8d,#c77e72);color:#fffaf4;font:700 .78rem/1 Arial,sans-serif;cursor:pointer;box-shadow:0 10px 20px rgba(130,76,65,.18)}.auth-btn:disabled{opacity:.6;cursor:wait}.auth-msg{min-height:22px;margin-top:12px;color:#9a5d53;font:italic .7rem/1.45 Georgia,serif}.auth-loading{display:none;margin-top:12px;color:#866454;font:italic .72rem/1.5 Georgia,serif}.auth-card.loading .auth-loading{display:block}.auth-card.loading .auth-row{opacity:.65;pointer-events:none}@media(max-width:560px){.auth-card{padding:31px 18px 25px;border-radius:20px}.auth-row{flex-direction:column}.auth-btn{width:100%}}
</style>
</head>
<body>
<div class="auth-shell" id="authShell">
  <section class="auth-card" id="authCard">
    <div class="auth-kicker">A letter meant only for you</div>
    <h1>To, my March</h1>
    <p class="auth-copy">One tiny secret before these pages open. The answer stays between you and the letter.</p>
    <div class="auth-row">
      <input id="sitePassword" class="auth-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="DDMM" maxlength="12" aria-describedby="authMessage">
      <button id="siteUnlock" class="auth-btn" type="button">Unlock the letter</button>
    </div>
    <div id="authMessage" class="auth-msg" aria-live="polite"></div>
    <div class="auth-loading">The seal knows you. Opening your letter...</div>
  </section>
</div>
<script>
(()=>{
  const API='https://the-d-project-auth.floot.app/_api/site';
  const TOKEN_KEY='tdp_access_token';
  const card=document.getElementById('authCard');
  const input=document.getElementById('sitePassword');
  const button=document.getElementById('siteUnlock');
  const message=document.getElementById('authMessage');

  const post=async(path,payload)=>{
    const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),cache:'no-store'});
    let data={};try{data=await r.json()}catch{}
    return {r,data};
  };

  const loadExperience=async()=>{
    card.classList.add('loading');message.textContent='';
    try{
      const source='https://raw.githubusercontent.com/Vtslkumar1303/theDproject/22e18ec9c55cd337254e3eee3f129c1c79c76136/index.html';
      const r=await fetch(source,{cache:'no-store'});
      if(!r.ok)throw new Error('Base experience could not be loaded');
      let h=await r.text();
      const v='20260915-server-auth-v1';
      const oldHead="h=h.replace('</head>','<style>'+css+'</style></head>');";
      const newHead="h=h.replace('</head>','<style>'+css+'</style><link rel=\"stylesheet\" href=\"opening.css?v="+v+"\"><link rel=\"stylesheet\" href=\"experience-patch.css?v="+v+"\"></head>');";
      const oldBody="h=h.replace('</body>','<script>'+js+'</scr'+'ipt></body>');";
      const newBody="h=h.replace('</body>','<script>'+js+'</scr'+'ipt><script src=\"opening.js?v="+v+"\"></scr'+'ipt><script src=\"khat-lyrics.js?v="+v+"\"></scr'+'ipt><script src=\"lyric-player.js?v="+v+"\"></scr'+'ipt><script src=\"experience-patch.js?v="+v+"\"></scr'+'ipt></body>');";
      if(!h.includes(oldHead)||!h.includes(oldBody))throw new Error('Enhancement injection point not found');
      h=h.replace(oldHead,newHead).replace(oldBody,newBody);
      document.open();document.write(h);document.close();
    }catch(e){card.classList.remove('loading');message.textContent='The letter could not be loaded. Please try once more.';console.error(e)}
  };

  const validateSavedToken=async()=>{
    const token=sessionStorage.getItem(TOKEN_KEY);
    if(!token)return false;
    try{
      const {r,data}=await post('/session',{token});
      if(r.ok&&data.ok)return true;
    }catch{}
    sessionStorage.removeItem(TOKEN_KEY);
    return false;
  };

  const unlock=async()=>{
    const password=input.value.trim();
    if(!password){message.textContent='A tiny secret is still missing.';input.focus();return}
    button.disabled=true;message.textContent='Checking the little secret...';
    try{
      const {r,data}=await post('/login',{password});
      if(!r.ok||!data.ok){message.textContent=data.message||'Not quite. Try that little secret once more.';input.select();return}
      sessionStorage.setItem(TOKEN_KEY,data.token);
      await loadExperience();
    }catch(e){message.textContent='The lock could not be reached. Please try again in a moment.';console.error(e)}
    finally{button.disabled=false}
  };

  button.addEventListener('click',unlock);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
  validateSavedToken().then(ok=>{if(ok)loadExperience();else setTimeout(()=>input.focus(),120)});
})();
</script>
</body>
</html>
