<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To, my March</title>
<style>html,body{margin:0;min-height:100%;background:#efe0c2;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}#boot{min-height:100vh;display:grid;place-items:center;color:#4f2f24}</style>
</head>
<body>
<div id="boot">Opening the letter...</div>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/Vtslkumar1303/theDproject/22e18ec9c55cd337254e3eee3f129c1c79c76136/index.html';
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('Base experience could not be loaded');
    let h=await r.text();
    h=h.replace("h=h.replace('</head>','<style>'+css+'</style></head>');","h=h.replace('</head>','<style>'+css+'</style><link rel=\"stylesheet\" href=\"opening.css\"><link rel=\"stylesheet\" href=\"experience-patch.css\"></head>');");
    h=h.replace("h=h.replace('</body>','<script>'+js+'</scr'+'ipt></body>');","h=h.replace('</body>','<script>'+js+'</scr'+'ipt><script src=\"opening.js\"></scr'+'ipt><script src=\"experience-patch.js\"></scr'+'ipt></body>');");
    document.open();document.write(h);document.close();
  }catch(e){
    document.getElementById('boot').textContent='The letter could not be loaded. Please refresh once.';
    console.error(e);
  }
})();
</script>
</body>
</html>
