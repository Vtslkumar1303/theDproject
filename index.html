<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>To, my March</title>
<style>
html,body{margin:0;min-height:100%;background:#d8c4a5;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
#boot{min-height:100vh;display:grid;place-items:center;color:#4f2f24;font-size:.95rem;letter-spacing:.08em}
</style>
</head>
<body>
<div id="boot">Opening the letter...</div>
<script>
(async function(){
  const enhancementCss = String.raw`
/* Enhancements only — the original DraftD background is intentionally untouched. */
.verse-list-wrap{position:relative;z-index:4;width:min(820px,calc(100% - 24px));margin:0 auto 92px;padding:8px 0 24px}
.verse-list-intro{text-align:center;padding:34px 18px 28px}
.verse-list-intro span{display:block;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:#7c1f2a;font-weight:700}
.verse-list-intro h2{font:600 clamp(1.8rem,5vw,3rem)/1.16 "Segoe Print","Bradley Hand","Comic Sans MS",cursive;margin:10px 0 8px;color:#4f2f24}
.verse-list-intro p{max-width:560px;margin:auto;color:#755447;line-height:1.7;font-size:.96rem}
.section.verse-card{min-height:0!important;display:block!important;align-items:initial!important;padding:0!important;margin:0 0 14px!important;background:rgba(255,248,233,.62)!important;border:1px solid rgba(92,57,41,.16);border-radius:20px;box-shadow:0 9px 24px rgba(82,49,35,.07);overflow:visible;transition:transform .3s ease,box-shadow .3s ease,background .3s ease}
.section.verse-card.open{background:rgba(255,250,240,.82)!important;box-shadow:0 15px 36px rgba(82,49,35,.12);transform:translateY(-2px)}
.section.verse-card .verse{opacity:1!important;transform:none!important;width:100%!important;margin:0!important;position:relative;z-index:3}
.verse-toggle{position:relative;z-index:5;width:100%;border:0;background:transparent;color:#4f2f24;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;text-align:left;cursor:pointer}
.verse-toggle:hover{background:rgba(255,255,255,.18)}
.verse-toggle:focus-visible{outline:2px solid rgba(124,31,42,.45);outline-offset:-3px;border-radius:18px}
.verse-heading small{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#a63f4c;font-weight:700;margin-bottom:5px}
.verse-heading strong{display:block;font:600 clamp(1.08rem,3vw,1.42rem)/1.28 "Segoe Print","Bradley Hand","Comic Sans MS",cursive}
.verse-chevron{width:12px;height:12px;border-right:2px solid #755447;border-bottom:2px solid #755447;transform:rotate(45deg);transition:transform .42s cubic-bezier(.2,.8,.2,1);flex:0 0 auto;margin-right:4px}
.verse-card.open .verse-chevron{transform:rotate(-135deg);margin-top:8px}
.verse-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .62s cubic-bezier(.2,.8,.2,1)}
.verse-copy{overflow:hidden;padding:0 21px;opacity:0;transform:translateY(-10px);transition:opacity .4s ease,transform .48s ease,padding .55s ease}
.verse-card.open .verse-panel{grid-template-rows:1fr}
.verse-card.open .verse-copy{padding:3px 22px 25px;opacity:1;transform:none}
.verse-copy p{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:clamp(.96rem,2.5vw,1.08rem);line-height:1.82;margin:0 0 1.15em;color:#604336}
.verse-copy .quote{margin:22px 0}.verse-copy .cassette-scene{margin-top:24px}
.verse-card::after{content:"";position:absolute;left:50%;top:58px;width:6px;height:6px;border-radius:50%;background:transparent;pointer-events:none}
.verse-card.open::after{animation:paperDust .8s ease-out}
@keyframes paperDust{0%{background:rgba(166,63,76,.35);box-shadow:-24px 4px rgba(168,121,67,.30),22px -3px rgba(124,31,42,.25);transform:scale(.4)}100%{background:transparent;box-shadow:-42px 18px transparent,40px 15px transparent;transform:scale(1.7)}}
.freeze-time{position:fixed;z-index:160;right:16px;top:16px;border:1px solid rgba(84,51,38,.22);border-radius:999px;padding:10px 15px;background:rgba(248,236,212,.92);color:#4f2f24;box-shadow:0 8px 22px rgba(71,42,28,.12);backdrop-filter:blur(8px);cursor:pointer;font:600 .78rem "Segoe Print","Bradley Hand","Comic Sans MS",cursive}
.freeze-time[aria-pressed="true"]{background:#56362a;color:#fff8eb}
.time-frozen .petal{animation-play-state:paused!important}
.scroll-hint{cursor:pointer;display:inline-block;padding:8px 12px;border-radius:999px;transition:background .25s ease,transform .25s ease;user-select:none}
.scroll-hint:hover{background:rgba(255,255,255,.25);transform:translateY(2px)}
.spotify-player{position:sticky;z-index:90;bottom:10px;width:min(760px,calc(100% - 22px));margin:18px auto 34px;display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:14px;border-radius:22px;background:linear-gradient(145deg,#362924,#181514);color:#fff8ef;box-shadow:0 20px 50px rgba(37,24,19,.32);border:1px solid rgba(255,255,255,.08)}
.spotify-art{width:112px;height:112px;border-radius:14px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.28);background:#3b302b}
.spotify-art img{width:100%;height:100%;object-fit:cover}
.spotify-body{min-width:0}.spotify-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.spotify-topline>span{font-size:.62rem;letter-spacing:.18em;opacity:.55}
.spotify-body h3{margin:4px 0 0;font:700 1.28rem Georgia,serif}.spotify-body>p{margin:2px 0 8px;font-size:.75rem;opacity:.66}
.spotify-seek{width:100%;accent-color:#fff;margin:2px 0}.spotify-time{display:flex;justify-content:space-between;font-size:.64rem;opacity:.56}
.spotify-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:center;margin-top:6px}.spotify-controls button,.playlist-toggle{border:0;background:transparent;color:#fff;cursor:pointer;border-radius:999px;min-height:36px}.spotify-controls button:hover,.playlist-toggle:hover{background:rgba(255,255,255,.08)}
.spotify-play{width:48px;height:48px;justify-self:center;background:#fff!important;color:#1d1715!important;font-weight:700}
.playlist-toggle{padding:5px 10px;font-size:.72rem;min-height:30px}.playlist-drawer{max-height:0;overflow:hidden;transition:max-height .42s ease}.playlist-drawer.open{max-height:230px;margin-top:8px}
.playlist-row{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:7px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}.playlist-row img{width:38px;height:38px;object-fit:cover;border-radius:6px}.playlist-row strong{display:block;font-size:.8rem}.playlist-row small{display:block;font-size:.65rem;opacity:.6}.playlist-row span{font-size:.64rem;opacity:.6}.playlist-note{font-size:.62rem!important;opacity:.45!important;margin:8px 6px 2px!important}
@media(max-width:640px){.verse-list-wrap{width:calc(100% - 16px);margin-bottom:74px}.verse-toggle{padding:16px 15px}.verse-card.open .verse-copy{padding:2px 16px 21px}.freeze-time{top:auto;bottom:12px;right:12px}.spotify-player{position:relative;bottom:auto;grid-template-columns:82px minmax(0,1fr)}.spotify-art{width:82px;height:82px}.spotify-controls button{font-size:.7rem}.spotify-play{width:42px;height:42px}.section.verse-card>.side-object{opacity:.45!important;max-width:115px!important}}
@media(prefers-reduced-motion:reduce){.verse-panel,.verse-copy,.verse-chevron,.verse-card{transition:none!important}.verse-card.open::after{animation:none!important}}
`;

  const enhancementJs = String.raw`
(function(){
  const body=document.body;
  const main=document.getElementById('letter');
  const audio=document.getElementById('audio');
  if(!main||!audio)return;

  // Remove decorative emoji glyphs without changing sentence wording.
  const removeGlyphs=/[🤍✨▶❚↓]/gu;
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{if(!['SCRIPT','STYLE'].includes(n.parentElement?.tagName||''))n.nodeValue=n.nodeValue.replace(removeGlyphs,'');});

  // Convert all ten verses into independent expandable list cards.
  const hero=main.querySelector('.hero');
  const sections=[...main.querySelectorAll(':scope > .section')].filter(s=>s.querySelector('.verse'));
  const wrap=document.createElement('div');wrap.className='verse-list-wrap';wrap.id='verses';
  const intro=document.createElement('div');intro.className='verse-list-intro';
  intro.innerHTML='<span>The Letter</span><h2>Ten verses, kept between pages.</h2><p>Open any verse when you are ready. It will stay open until you close it.</p>';
  wrap.appendChild(intro);
  sections.forEach(sec=>{
    sec.classList.add('verse-card');
    const article=sec.querySelector('.verse');
    const number=article.querySelector('.verse-number');
    const title=article.querySelector('h2');
    const toggle=document.createElement('button');toggle.type='button';toggle.className='verse-toggle';toggle.setAttribute('aria-expanded','false');
    toggle.innerHTML='<span class="verse-heading"><small></small><strong></strong></span><span class="verse-chevron" aria-hidden="true"></span>';
    toggle.querySelector('small').textContent=number?.textContent||'';toggle.querySelector('strong').textContent=title?.textContent||'';
    const panel=document.createElement('div');panel.className='verse-panel';const copy=document.createElement('div');copy.className='verse-copy';
    [...article.childNodes].forEach(node=>{if(node!==number&&node!==title)copy.appendChild(node);});
    number?.remove();title?.remove();article.append(toggle,panel);panel.appendChild(copy);
    toggle.addEventListener('click',()=>{const isOpen=sec.classList.toggle('open');toggle.setAttribute('aria-expanded',String(isOpen));});
    wrap.appendChild(sec);
  });
  if(hero)hero.insertAdjacentElement('afterend',wrap);

  // Make the existing scroll prompt functional.
  const scrollHint=document.querySelector('.scroll-hint');
  if(scrollHint){scrollHint.setAttribute('role','button');scrollHint.setAttribute('tabindex','0');scrollHint.textContent=scrollHint.textContent.replace('↓','').trim();const go=()=>wrap.scrollIntoView({behavior:'smooth',block:'start'});scrollHint.addEventListener('click',go);scrollHint.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});}

  // Freeze / resume only the falling petal animations.
  const freeze=document.createElement('button');freeze.id='freezeTimeBtn';freeze.className='freeze-time';freeze.type='button';freeze.textContent='Freeze the time';freeze.setAttribute('aria-pressed','false');
  freeze.addEventListener('click',()=>{const frozen=body.classList.toggle('time-frozen');freeze.setAttribute('aria-pressed',String(frozen));freeze.textContent=frozen?'Let time flow':'Freeze the time';});
  document.body.appendChild(freeze);

  // Replace the compact player with a Spotify-inspired playlist-ready player.
  const oldPlayer=document.getElementById('musicCard');
  const player=document.createElement('div');player.id='musicCard';player.className='spotify-player';
  player.innerHTML='<div class="spotify-art"><img id="playerCover" alt="Khat original song artwork"></div><div class="spotify-body"><div class="spotify-topline"><span>NOW PLAYING</span><button id="playlistToggle" class="playlist-toggle" type="button">Playlist</button></div><h3 id="trackTitle">Khat</h3><p id="trackArtist">Navjot Ahuja</p><input class="spotify-seek" id="spotifySeek" type="range" min="0" max="1000" value="0" aria-label="Song progress"><div class="spotify-time"><span id="spotifyCurrent">0:00</span><span id="spotifyDuration">0:00</span></div><div class="spotify-controls"><button id="prevTrack" type="button" aria-label="Previous song">|&lt;</button><button id="back10" type="button" aria-label="Back 10 seconds">-10</button><button class="spotify-play" id="spotifyPlay" type="button" aria-label="Play song">Play</button><button id="forward10" type="button" aria-label="Forward 10 seconds">+10</button><button id="nextTrack" type="button" aria-label="Next song">&gt;|</button></div><div class="playlist-drawer" id="playlistDrawer"><div id="playlistRows"></div><p class="playlist-note">More songs can be added to the playlist array later.</p></div></div>';
  oldPlayer?.replaceWith(player);

  const ORIGINAL_KHAT_POSTER='https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/ea/01/29/ea012994-51e8-6883-e1e1-c71fdd51754f/5026854264479.jpg/1200x1200bb.jpg';
  const playlist=[{id:'khat',title:'Khat',artist:'Navjot Ahuja',file:'assets/asset-07-a968de82ccb4.mp3',cover:ORIGINAL_KHAT_POSTER}];
  let trackIndex=0;
  const cover=document.getElementById('playerCover'),title=document.getElementById('trackTitle'),artist=document.getElementById('trackArtist'),seek=document.getElementById('spotifySeek'),current=document.getElementById('spotifyCurrent'),duration=document.getElementById('spotifyDuration'),play=document.getElementById('spotifyPlay'),drawer=document.getElementById('playlistDrawer'),rows=document.getElementById('playlistRows');
  const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');};
  function renderRows(){rows.innerHTML='';playlist.forEach((t,i)=>{const row=document.createElement('div');row.className='playlist-row';row.innerHTML='<img alt=""><div><strong></strong><small></small></div><span></span>';row.querySelector('img').src=t.cover;row.querySelector('strong').textContent=t.title;row.querySelector('small').textContent=t.artist;row.querySelector('span').textContent=i===trackIndex&&!audio.paused?'Playing':'';row.addEventListener('click',()=>loadTrack(i,true));rows.appendChild(row);});}
  function sync(){play.textContent=audio.paused?'Play':'Pause';play.setAttribute('aria-label',audio.paused?'Play song':'Pause song');current.textContent=fmt(audio.currentTime);duration.textContent=fmt(audio.duration);seek.value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0;renderRows();}
  function loadTrack(i,auto){trackIndex=(i+playlist.length)%playlist.length;const t=playlist[trackIndex];audio.src=t.file;cover.src=t.cover;title.textContent=t.title;artist.textContent=t.artist;renderRows();if(auto)audio.play().catch(()=>{});}
  play.addEventListener('click',()=>audio.paused?audio.play().catch(()=>{}):audio.pause());document.getElementById('back10').addEventListener('click',()=>audio.currentTime=Math.max(0,audio.currentTime-10));document.getElementById('forward10').addEventListener('click',()=>audio.currentTime=Math.min(audio.duration||1e9,audio.currentTime+10));document.getElementById('prevTrack').addEventListener('click',()=>loadTrack(trackIndex-1,true));document.getElementById('nextTrack').addEventListener('click',()=>loadTrack(trackIndex+1,true));document.getElementById('playlistToggle').addEventListener('click',()=>drawer.classList.toggle('open'));seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=audio.duration*(Number(seek.value)/1000);});audio.addEventListener('timeupdate',sync);audio.addEventListener('loadedmetadata',sync);audio.addEventListener('play',sync);audio.addEventListener('pause',sync);audio.addEventListener('ended',()=>loadTrack(trackIndex+1,true));
  loadTrack(0,false);sync();
})();
`;

  try{
    const response=await fetch('DraftD.html',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load DraftD.html');
    let html=await response.text();
    html=html.replace('</head>','<style>'+enhancementCss+'</style></head>');
    html=html.replace('</body>','<script>'+enhancementJs+'</scr'+'ipt></body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('boot').textContent='The letter could not be loaded. Please refresh once.';
    console.error(err);
  }
})();
</script>
</body>
</html>
